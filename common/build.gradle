architectury {
    common rootProject.enabled_platforms.split(',')
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    mavenLocal()
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modImplementation("maven.modrinth:tiny-config:${project.tiny_config_version}-fabric")
    //modImplementation "net.tiny_config:tiny_config-fabric:${project.tiny_config_version}"

    // Optional integrations, compile only (never required at runtime, see `compat` package)
    // Fabric API is only here so Loom remaps the above mods correctly (they implement Fabric API interfaces,
    // and the remapped jars are shared with the fabric module). Do NOT use Fabric API in common.
    modCompileOnly "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    modCompileOnly("maven.modrinth:waystones:${project.waystones_version}+fabric-${project.minecraft_version}")
    modCompileOnly("maven.modrinth:balm:${project.balm_version}+fabric-${project.minecraft_version}")
}
